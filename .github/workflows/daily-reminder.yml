name: Daily reminder

# MP-070: prior-day 8 PM IST reminder push. India has no DST, so a fixed UTC cron (20:00 IST -
# 5:30 = 14:30 UTC) never drifts.
#
# PR #10 review finding: the scheduled trigger was enabled before the repo secrets it needs
# existed, so every nightly run would just fail with a ConfigError — noisy and pointless, not
# actually gated on anything. Re-enabled here (PR #11) after the required secrets were
# provisioned and a workflow_dispatch run on this exact branch (32941228662) completed
# successfully end-to-end, including a real push delivered to a physical device.
on:
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-daily-reminder:
    name: send tomorrow's plan reminder
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily reminder job
        env:
          # `python scripts/run_daily_reminder.py` puts scripts/ (the invoked file's own
          # directory), not backend/, on sys.path[0] — app/ is a sibling of scripts/, not inside
          # it, so `from app.config import ...` fails with ModuleNotFoundError without this.
          # Caught by the first real workflow_dispatch run (PR #10 review, MP-070 verification).
          PYTHONPATH: .
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          # SUPABASE_DB_PORT deliberately omitted: an unset secrets.X resolves to an empty string
          # in Actions, not an absent var, and app/config.py's "fall back to the 5432 default"
          # logic only recognizes truly-missing env vars — an empty string fails int validation
          # instead. No SUPABASE_DB_PORT secret exists (default port is correct), so leave it out.
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
        run: python scripts/run_daily_reminder.py
