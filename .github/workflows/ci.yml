name: CI

# Runs on every push to every branch (so issues surface before a PR is even raised) and on every
# PR into main (so the check results show up on the PR itself).
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (type-check, lint, test, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # MP-031's repository integration tests build a throwaway database from the real
    # supabase/migrations/*.sql (schema + RLS) against this container — see backend/tests/conftest.py.
    # Without it those tests skip rather than fail, so they'd never actually run in CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_TEST_HOST: localhost
      POSTGRES_TEST_PORT: 5432
      POSTGRES_TEST_USER: postgres
      POSTGRES_TEST_PASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: python -m ruff check .

      - name: mypy type-check
        run: python -m mypy app/

      - name: pytest
        # MP-012's live sign-in test (test_supabase_auth.py) needs these to actually run instead
        # of skipping — see docs/MP-006-MP-012-supabase-setup.md. Secrets aren't exposed to
        # pull_request runs from forks (GitHub default), so this test correctly falls back to
        # skipping there; safe for this repo since only the owner can push/open same-repo PRs.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_TEST_USER_EMAIL: ${{ secrets.SUPABASE_TEST_USER_EMAIL }}
          SUPABASE_TEST_USER_PASSWORD: ${{ secrets.SUPABASE_TEST_USER_PASSWORD }}
        run: python -m pytest tests/ -v

      - name: pip-audit
        run: python -m pip_audit -r requirements.txt

  mobile:
    name: mobile (type-check, lint, format, test, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx expo lint

      - name: Prettier format check
        run: npx prettier --check .

      - name: Jest
        run: npx jest --ci

      - name: npm audit (high+ only)
        run: npm audit --audit-level=high

  supabase-schema:
    name: supabase (schema + RLS tests, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: supabase/tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run schema + RLS tests (pglite — real Postgres semantics, no live DB needed)
        run: npx vitest run

      - name: npm audit (high+ only)
        run: npm audit --audit-level=high

  security:
    name: security (secrets, SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # secret scanning needs full history, not just the latest commit

      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: gitleaks secret scan
        run: gitleaks detect --source . --redact -v

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install semgrep
        run: pip install semgrep

      - name: Semgrep SAST
        run: semgrep scan --config=p/ci --error
